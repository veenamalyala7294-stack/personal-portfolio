<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | My Portfolio</title>

    <meta
        name="description"
        content="Contact through the portfolio contact form."
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav aria-label="Main navigation">

            <h1>My Portfolio</h1>

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main id="main-content">


        <section aria-labelledby="contact-heading">

            <h2 id="contact-heading">
                Contact Me
            </h2>

            <p>
                Please fill out the form below to send a message.
            </p>


            <form action="#" method="post">


                <div>

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div>

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >

                </div>


                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>


            </form>


        </section>


    </main>


    <footer>

        <p>
            &copy; 2026 My Portfolio.
            All rights reserved.
        </p>

    </footer>

</body>

</html>
